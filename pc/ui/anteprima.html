<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- L'esempio di un modello (pagina Modelli, 1.5.0): il documento lo scrive anteprima.js con l'HTML che gli dà la pagina
       di Wisper (stessa origine). Il documento ha lo stile dentro, come quando si stampa: per questo qui, e solo qui, lo
       stile scritto nella pagina è permesso. Nessuno script oltre ad anteprima.js, niente rete. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Esempio</title>
</head>
<body>
  <script src="anteprima.js"></script>
</body>
</html>
